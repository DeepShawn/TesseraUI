name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: 生成的产物必须和 token 源文件一致
        run: git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: 安装 Playwright（仅用于测试，不是项目依赖）
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: 启动静态服务器
        run: python3 -m http.server 5173 &
      - run: npm run test:e2e

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: 编译
        run: gradle :tessera:compileDebugKotlin
      - name: 截图对比（Paparazzi）
        run: gradle :tessera:verifyPaparazziDebug

  apple:
    runs-on: macos-15
    defaults:
      run:
        working-directory: platforms/apple
    steps:
      - uses: actions/checkout@v4
      - name: 编译（macOS）
        run: swift build
      - name: 编译（iOS 模拟器）
        run: xcodebuild -scheme TesseraUI -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build | tail -20
