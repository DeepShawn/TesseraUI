name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: 生成的产物必须和 token 源文件一致
        run: git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: 安装 Playwright（仅用于测试，不是项目依赖）
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: 启动静态服务器
        run: python3 -m http.server 5173 &
      - run: npm run test:e2e

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: 编译
        run: gradle :tessera:compileDebugKotlin
      - name: 截图对比（Paparazzi）
        run: gradle :tessera:verifyPaparazziDebug

  apple:
    runs-on: macos-15
    defaults:
      run:
        working-directory: platforms/apple
    steps:
      - uses: actions/checkout@v4
      - name: 编译（macOS）
        run: swift build
      - name: 编译（iOS 模拟器）
        run: |
          set -o pipefail
          xcodebuild -scheme TesseraUI -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platforms/windows/TesseraUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # 生成 PRI 资源索引需要 Visual Studio 的打包任务，dotnet CLI 没有，所以用 VS 的 MSBuild
      - uses: microsoft/setup-msbuild@v2
      - name: 编译（WinUI 3，x64）
        run: msbuild TesseraUI.csproj -restore -p:Configuration=Release -p:Platform=x64 -v:minimal
