name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: 生成的产物必须和 token 源文件一致
        run: git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: 安装 Playwright（仅用于测试，不是项目依赖）
        run: npm install --no-save playwright axe-core@4 && npx playwright install --with-deps chromium
      - name: 启动静态服务器
        run: python3 -m http.server 5173 &
      - run: npm run test:e2e
      - name: 端到端测试（圆融外观）
        if: always()
        run: npm run test:e2e
        env:
          TESSERA_SHAPE: round
      - name: 端到端测试（流韵外观）
        if: always()
        run: npm run test:e2e
        env:
          TESSERA_SHAPE: flow
      - name: 输入框逐项截图审查（三种外观 × 浅色 / 深色 × 桌面 / 手机）
        if: always()
        run: npm run test:inputs
      - name: 无障碍扫描（axe：两页 × 三种外观 × 浅色 / 深色 / 增强对比度 × 桌面 / 手机）
        if: always()
        run: npm run test:a11y
      - name: 视觉回归（组件计算样式与基准比对）
        if: always()
        run: npm run test:visual
      # 每一项测试都会截图（三种外观各一组），失败的截图文件名带“失败”
      - name: 上传测试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: 编译
        run: gradle :tessera:compileDebugKotlin
      - name: 截图对比（Paparazzi）
        run: gradle :tessera:verifyPaparazziDebug
      - name: 上传截图差异图（截图对比失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-snapshot-diffs
          path: platforms/android/tessera/build/paparazzi/failures/
      - name: 无障碍检查（Robolectric）
        run: gradle :sample:testDebugUnitTest
      - name: 示例 App
        run: gradle :sample:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-sample-apk
          path: platforms/android/sample/build/outputs/apk/debug/sample-debug.apk

  apple:
    runs-on: macos-15
    defaults:
      run:
        working-directory: platforms/apple
    steps:
      - uses: actions/checkout@v4
      - name: 编译（macOS）
        run: swift build
      - name: 截图（ImageRenderer）
        run: TESSERA_SNAPSHOT_DIR=$PWD/snapshots swift test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-snapshots
          path: platforms/apple/snapshots/
      - name: iOS 示例 App 与无障碍检查（XCUITest，三种外观，每种截图）
        working-directory: platforms/apple/Examples
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "模拟器 $UDID"
          xcodebuild test -project TesseraSampleiOS.xcodeproj -scheme TesseraSampleiOS -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee test.log | grep -E "error:|无障碍检查|✖|Test Case .* (passed|failed)|\*\* TEST" || true
          # 截图作为测试附件保存在结果包里，导出成图片
          mkdir -p ../ios-snapshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path ../ios-snapshots || true
          ls ../ios-snapshots
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-snapshots
          path: platforms/apple/ios-snapshots/
      - name: 编译（iOS 模拟器）
        run: |
          set -o pipefail
          xcodebuild -scheme TesseraUI -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platforms/windows/TesseraUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # 生成 PRI 资源索引需要 Visual Studio 的打包任务，dotnet CLI 没有，所以用 VS 的 MSBuild
      - uses: microsoft/setup-msbuild@v2
      - name: 编译（WinUI 3，x64）
        run: msbuild TesseraUI.csproj -restore -p:Configuration=Release -p:Platform=x64 -v:minimal
      - name: 示例 App
        working-directory: platforms/windows/TesseraSample
        run: msbuild TesseraSample.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal
      - name: 截图与无障碍检查
        working-directory: platforms/windows/TesseraSample
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter TesseraSample.exe bin | Select-Object -First 1
          $out = Join-Path $PWD 'snapshots'
          $p = Start-Process $exe.FullName -ArgumentList '--snapshot', $out -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Error '超时'; exit 1 }
          Get-ChildItem $out | ForEach-Object { $_.Name }
          if (Test-Path "$out/a11y.txt") { Get-Content "$out/a11y.txt" }
          if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
          if (Test-Path "$out/progress.txt") { Get-Content "$out/progress.txt" }
          "退出码 $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            # 原生崩溃时没有托管异常：从系统事件日志里取崩溃模块与异常代码
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -MaxEvents 8 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in 'Application Error', '.NET Runtime', 'Windows Error Reporting' } | Format-List TimeCreated, ProviderName, Message
          }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-snapshots
          path: platforms/windows/TesseraSample/snapshots/
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-sample-windows
          path: platforms/windows/TesseraSample/bin/x64/Release/
